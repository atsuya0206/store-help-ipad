<script>
// URL の # の後ろ（GitHub には送られない）に g=ウェブアプリのID、k=合言葉 または s=QRの共有キー が入っている
(function(){
  var hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  var saved = {}; try { saved = JSON.parse(localStorage.getItem('storeHelpConn') || '{}'); } catch (e) {}
  var conn = { g: hp.get('g') || '', k: hp.get('k') || hp.get('s') || '', share: !!hp.get('s'), store: hp.get('store') || '' };
  if (!conn.g || !conn.k) conn = saved;                       // ホーム画面から開いて # が消えた場合の保険
  else if (!conn.share) { try { localStorage.setItem('storeHelpConn', JSON.stringify(conn)); } catch (e) {} }
  window.__CONN = conn;
  window.__IMG = {"RECOCO渋谷":"img/recoco_shibuya.jpg","CASSE":"img/casse.jpg","RECOCO下北沢":"img/recoco_shimokita.jpg","セルフォト":"img/selphoto.jpg","RETOPO渋谷":"img/retopo_shibuya.jpg"};
  window.__PARTS = {"RECOCO渋谷":{"logo":"img/recoco_shibuya_logo.jpg","label":"img/recoco_shibuya_label.jpg"},"CASSE":{"logo":"img/casse_logo.jpg","label":"img/casse_label.jpg"},"RECOCO下北沢":{"logo":"img/recoco_shimokita_logo.jpg","label":"img/recoco_shimokita_label.jpg"},"セルフォト":{"logo":"img/selphoto_logo.jpg","label":"img/selphoto_label.jpg"},"RETOPO渋谷":{"logo":"img/retopo_shibuya_logo.jpg","label":"img/retopo_shibuya_label.jpg"}};
})();
function __api(op, params) {
  var c = window.__CONN, q = new URLSearchParams(Object.assign({ api: 'ipad', op: op, k: c.k }, params || {}));
  return fetch('https://script.google.com/macros/s/' + encodeURIComponent(c.g) + '/exec?' + q.toString(), { method: 'GET', redirect: 'follow' })
    .then(function(r){ return r.json(); });
}
// 画面のコードはそのまま使い、google.script.run の呼び出しだけを差し替える
var google = { script: {} };
Object.defineProperty(google.script, 'run', { get: function(){
  var ok = null, ng = null, o = {
    withSuccessHandler: function(f){ ok = f; return o; },
    withFailureHandler: function(f){ ng = f; return o; },
    ipadSendHelp: function(k, store){ go(__api('help', { store: store })); },
    ipadSendNote: function(k, no, text){ go(__api('note', { no: no, text: text })); },
    ipadStatus:   function(k, nos){ go(__api('status', { nos: nos.join(',') })); },
    ipadShareLink: function(k, nos){ go(__api('share', { nos: nos.join(',') }).then(function(r){
      if (r && r.ok && r.key) r.url = location.origin + location.pathname + '#g=' + encodeURIComponent(window.__CONN.g) + '&s=' + r.key;
      return r; })); },
  };
  function go(p){ p.then(function(r){ ok && ok(r); }, function(e){ ng && ng(e); }); }
  return o;
}});
</script>
<style>
  :root { --bar:#1f2a3a; --bg:#8cabd9; --me:#8de055; --other:#fff; --ink:#111; --sub:#5d6b7c;
          --pill:rgba(0,0,0,.18); --menu:#fff; --menu-line:#e6e6e6; --help:#e2493a; --send:#06c755; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; }
  header { background:var(--bar); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:12px; flex:none; }
  header .av { width:36px; height:36px; border-radius:50%; background:#e2493a; display:flex; align-items:center; justify-content:center; font-size:20px; }
  header .nm { font-size:18px; font-weight:700; }
  header .st { font-size:12px; opacity:.75; }
  #chat { flex:1; overflow-y:auto; padding:14px 12px 20px; }
  .pill { margin:14px auto 10px; width:fit-content; max-width:92%; background:var(--pill); color:#fff;
          font-size:13px; padding:5px 12px; border-radius:999px; text-align:center; }
  .row { display:flex; align-items:flex-end; gap:8px; margin:8px 0; }
  .row.me { justify-content:flex-end; }
  .row .icon { width:38px; height:38px; border-radius:50%; background:#fff; flex:none; display:flex; align-items:center;
               justify-content:center; font-size:18px; align-self:flex-start; }
  .col { display:flex; flex-direction:column; max-width:72%; }
  .who { font-size:12px; color:#203047; margin:0 0 3px 4px; }
  .bub { position:relative; padding:10px 13px; border-radius:18px; font-size:17px; line-height:1.45;
         white-space:pre-wrap; word-break:break-word; }
  .other .bub { background:var(--other); border-top-left-radius:6px; }
  .me .bub { background:var(--me); border-top-right-radius:6px; }
  .bub.sys { background:#fff; border:3px solid var(--help); }
  .bub.sys b { color:var(--help); }
  .meta { font-size:11px; color:#26364d; margin:0 2px 2px; white-space:nowrap; }
  .empty { text-align:center; color:#fff; margin-top:30vh; font-size:16px; opacity:.9; line-height:1.7; }
  .inputbar { background:#fff; border-top:1px solid #ddd; padding:8px 10px; display:flex; gap:8px; align-items:center; flex:none; }
  .inputbar select { font-size:14px; border:1px solid #ddd; border-radius:10px; padding:8px; background:#f6f6f6; max-width:34%; }
  .inputbar input { flex:1; font-size:17px; border:0; background:#f2f2f2; border-radius:20px; padding:11px 14px; }
  .inputbar button { border:0; background:var(--send); color:#fff; font-size:16px; font-weight:700; border-radius:20px; padding:10px 16px; }
  .inputbar button[disabled] { background:#b8e6c9; }
  .layout { flex:1; display:flex; flex-direction:column; min-height:0; }
  .left { flex:1; display:flex; flex-direction:column; min-height:0; }
  .right { flex:none; background:#f7f0f0; border-top:1px solid var(--menu-line); }
  .menuHead { background:#8b2e2e; color:#fff; font-weight:700; font-size:15px; padding:8px 12px; letter-spacing:.05em; }
  .menu { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px; }
  .tile { border:0; padding:0; background:transparent; cursor:pointer; border-radius:7%/8%; overflow:hidden; display:block; }
  .tile img { width:100%; display:block; }
  .tile:active { transform:scale(.97); }
  .tile[disabled] { opacity:.5; }
  .tile.txt { aspect-ratio:480/418; color:#fff; font-size:20px; font-weight:800; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:10px; }
  .tile.txt small { background:#fff; color:#333; border-radius:999px; padding:4px 12px; font-size:13px; }
  /* スマホで続ける：店舗ボタンと同じ平らな面＋白い札。下に濃い影を付けて押せる見た目にする */
  .tile.qr { background:#2b3a4e; color:#fff; border-radius:18px; box-shadow:0 5px 0 #18222f; margin-bottom:5px;
             font-size:19px; letter-spacing:.02em; }
  .tile.qr svg { width:46px; height:46px; display:block; }
  .tile.qr small { background:#fff; color:#2b3a4e; font-weight:800; font-size:14px; padding:6px 16px; }
  .tile.qr:active { transform:translateY(4px); box-shadow:0 1px 0 #18222f; }
  .tile.qr[disabled] { opacity:1; background:#c3c8cf; box-shadow:0 5px 0 #a7adb6; color:#f4f5f7; }
  .tile.qr[disabled] small { background:#e4e7eb; color:#8a929c; }
  .tile.qr[disabled]:active { transform:none; }
  /* 店舗ごとのURL：その店舗のボタンだけを大きく出す */
  .menu.single { grid-template-columns:2fr 1fr; align-items:stretch; }
  .tile.part { display:flex; flex-direction:column; aspect-ratio:480/418; }
  .tile.part .logoBox { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  .tile.part .logo { width:var(--logo-size, 55%); height:auto; }
  .tile.part .lab { width:90%; margin:0 auto 5%; flex:none; }
  .menu.single .tile.qr { aspect-ratio:auto; }
  /* 縦置き：店舗ごとの画面は、メニューを画面の下半分いっぱいに広げる */
  @media (orientation: portrait) {
    .menu.single { height:46vh; grid-template-rows:1fr; }
    .menu.single .tile { height:100%; aspect-ratio:auto; }
    .menu.single .tile.part .lab { width:auto; max-width:90%; max-height:40%; }
  }
  @media (orientation: landscape) and (min-width: 700px) {
    .layout { flex-direction:row; }
    .right { width:44%; max-width:520px; border-top:0; border-left:1px solid var(--menu-line); overflow-y:auto; }
    .menu { grid-template-columns:repeat(2,1fr); gap:12px; padding:12px; }
    .menu.single { grid-template-columns:1fr; }
    .menu.single .tile.qr { flex-direction:row; padding:18px; gap:14px; }
  }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.on { display:flex; }
  .dlg { background:#fff; border-radius:14px; width:100%; max-width:380px; overflow:hidden; text-align:center; }
  .dlg p { font-size:18px; font-weight:700; margin:0; padding:24px 18px; }
  .dlg .btns { display:flex; border-top:1px solid #e5e5e5; }
  .dlg button { flex:1; font-size:17px; padding:15px; border:0; background:#fff; }
  .dlg .yes { color:var(--send); font-weight:700; border-left:1px solid #e5e5e5; }
  .qrBtn { border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:18px; padding:8px 12px; font-size:14px; }
  #qrBox svg, #qrBox img { width:240px; height:240px; }
  .toast { position:fixed; left:50%; top:76px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff;
           padding:10px 16px; border-radius:12px; font-size:15px; display:none; max-width:90%; text-align:center; z-index:5; }
</style></head><body>
<header><div class="av">🆘</div><div style="flex:1"><div class="nm">店舗ヘルプ</div><div class="st" id="sub">社員の LINE WORKS につながります</div></div></header>
<div class="layout"><div class="left">
<div id="chat"></div>
<div class="inputbar" id="inputbar" style="display:none">
  <select id="target"></select>
  <input id="msg" maxlength="500" placeholder="メッセージを入力">
  <button id="sendBtn">送信</button>
</div>
</div>
<div class="right" id="right"><div class="menuHead">！ 店舗ヘルプ</div><div class="menu" id="menu"></div></div>
</div>
<div class="modal" id="modal"><div class="dlg">
  <p id="askText"></p>
  <div class="btns"><button id="noBtn">キャンセル</button><button class="yes" id="yesBtn">呼ぶ</button></div>
</div></div>
<div class="modal" id="qrModal"><div class="dlg">
  <p style="padding-bottom:8px">スマホのカメラで読み取ってください</p>
  <div id="qrBox" style="display:flex;justify-content:center;padding:0 18px 8px"></div>
  <div id="qrNote" style="font-size:13px;color:#666;padding:0 18px 18px;line-height:1.6"></div>
  <div class="btns"><button id="qrClose">閉じる</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="qrcode.js"></script>
<script type="text/x-main" id="main">
var D = window.__D;
// 店舗ごとのURL（store= 付き）なら、その店舗のボタンだけにする
if (D.fixedStore) {
  D.stores = D.stores.filter(function(s){ return s.name === D.fixedStore; });
  document.getElementById('menu').classList.add('single');
  document.querySelector('.menuHead').textContent = '！ ' + D.fixedStore + ' のヘルプ';
  document.getElementById('sub').textContent = D.fixedStore + '｜社員の LINE WORKS につながります';
}
var KEY = D.share ? 'storeHelpShared' : 'storeHelpActive';
var active = load();           // [{no, store, at}] 古い順
// スマホ（QRから開いた）では、共有されたヘルプだけを表示し、店舗ボタンは出さない
if (D.share) {
  active = D.nos.map(function(no){ return { no: no, store: '', at: Date.now() }; });
  document.getElementById('right').style.display = 'none';
  document.getElementById('sub').textContent = '店舗iPadのやり取りの続き';
}
var pending = null, lastSig = '';

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(active)); } catch (e) {} }
function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
function toast(t) { var x = document.getElementById('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(function(){ x.style.display = 'none'; }, 3500); }
function emojiOf(store) { for (var i = 0; i < D.stores.length; i++) if (D.stores[i].name === store) return D.stores[i].emoji || '🏪'; return '🏪'; }

active = active.filter(function(a){ return Date.now() - a.at < 3 * 3600 * 1000; });
active.sort(function(a, b){ return a.at - b.at; }); save();

// LINE のリッチメニューと同じ見た目の店舗ボタン（常に表示）
var menu = document.getElementById('menu');
function colorOf(store) { for (var i = 0; i < D.stores.length; i++) if (D.stores[i].name === store) return D.stores[i].color; return '#d9412b'; }
D.stores.forEach(function(s) {
  var b;
  if (D.fixedStore && s.logo && s.label) {
    // 店舗ごとのURL：ボタンの大きさはそのまま、ロゴだけ小さく
    b = el('button', 'tile part'); b.style.background = s.color;
    var lb = el('div', 'logoBox'); var lg = el('img', 'logo'); lg.src = s.logo; lg.alt = s.name; lb.appendChild(lg); b.appendChild(lb);
    var la = el('img', 'lab'); la.src = s.label; la.alt = 'ヘルプを呼ぶ'; b.appendChild(la);
  } else if (s.img) {
    b = el('button', 'tile'); var im = el('img'); im.src = s.img; im.alt = s.name + ' ヘルプを呼ぶ'; b.appendChild(im);
  } else {
    b = el('button', 'tile txt'); b.style.background = s.color; b.appendChild(document.createTextNode(s.name)); b.appendChild(el('small', null, 'ヘルプを呼ぶ'));
  }
  b.onclick = function(){ pending = s.name; document.getElementById('askText').textContent = s.name + '　にヘルプを呼びますか？'; document.getElementById('modal').classList.add('on'); };
  menu.appendChild(b);
});
// 6つ目のマス：スマホで続ける（やり取り中のヘルプがあるときだけ押せる）
var qrTile = el('button', 'tile txt qr'); qrTile.id = 'qrTile';
qrTile.innerHTML = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="13" y="4" width="22" height="40" rx="4"/><line x1="21" y1="38" x2="27" y2="38"/>' +
  '<rect x="18" y="12" width="5" height="5" fill="currentColor" stroke="none"/><rect x="25" y="12" width="5" height="5" fill="currentColor" stroke="none"/>' +
  '<rect x="18" y="19" width="5" height="5" fill="currentColor" stroke="none"/><rect x="26" y="21" width="3" height="3" fill="currentColor" stroke="none"/></svg>';
qrTile.appendChild(document.createTextNode('スマホで続ける')); qrTile.appendChild(el('small', null, 'QRコードを表示'));
qrTile.disabled = true; menu.appendChild(qrTile);
document.getElementById('noBtn').onclick = function(){ document.getElementById('modal').classList.remove('on'); pending = null; };
document.getElementById('yesBtn').onclick = function(){
  var store = pending; document.getElementById('modal').classList.remove('on'); if (!store) return;
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){
    setBusy(false);
    if (!r || !r.ok) { toast((r && r.error) || '送れませんでした'); if (r && r.contact) toast('緊急連絡先: ' + r.contact); return; }
    if (!active.some(function(a){ return a.no === r.no; })) active.push({ no: r.no, store: r.store, at: Date.now() });
    save();
    if (r.dup) toast('#' + r.no + ' ですでに呼んでいます。そのままお待ちください');
    lastSig = ''; refresh();
  }).withFailureHandler(function(){ setBusy(false); toast('通信できませんでした。電話などで直接連絡してください'); }).ipadSendHelp(D.token, store);
};
function setBusy(on) { Array.prototype.forEach.call(document.querySelectorAll('.tile'), function(b){ b.disabled = on; }); }

document.getElementById('sendBtn').onclick = function(){
  var inp = document.getElementById('msg'), btn = this, no = document.getElementById('target').value;
  var t = inp.value.trim(); if (!t || !no) return; btn.disabled = true;
  google.script.run.withSuccessHandler(function(r){
    btn.disabled = false;
    if (!r || !r.ok) { toast((r && r.error) || '送れませんでした'); return; }
    inp.value = ''; inp.blur(); lastSig = ''; refresh();
  }).withFailureHandler(function(){ btn.disabled = false; toast('通信できませんでした'); }).ipadSendNote(D.token, no, t);
};

function refresh() {
  if (!active.length) { render([]); return; }
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.ok) { toast((r && r.error) || '状態を取得できませんでした'); return; }
    render(r.items);
  }).ipadStatus(D.token, active.map(function(a){ return a.no; }));
}

function render(items) {
  var sig = JSON.stringify(items);
  if (sig === lastSig) return;          // 変化がなければ描き直さない（スクロール位置を保つ）
  lastSig = sig;
  var chat = document.getElementById('chat'); chat.textContent = '';
  var live = items.filter(function(it){ return !it.gone; });
  if (!live.length) {
    chat.appendChild(el('div', 'empty', D.share ? 'このやり取りは終わりました。' : D.fixedStore ? '困ったときは、メニューの\n「ヘルプを呼ぶ」を押してください。\n社員にヘルプが届きます。' : '困ったときは、メニューから\n自分の店舗を押してください。\n社員にヘルプが届きます。'));
    chat.lastChild.style.whiteSpace = 'pre-line';
  }
  var sel = document.getElementById('target'); var keep = sel.value; sel.textContent = '';
  live.forEach(function(it) {
    chat.appendChild(el('div', 'pill', it.time + '  #' + it.no + ' ' + it.store));
    // 呼んだこと（自分側）
    var r0 = el('div', 'row me'); r0.appendChild(el('div', 'meta', it.time));
    var b0 = el('div', 'bub sys'); b0.style.borderColor = colorOf(it.store); var bt = el('b', null, '🆘 ヘルプ要請'); bt.style.color = colorOf(it.store); b0.appendChild(bt); b0.appendChild(document.createTextNode('\n' + emojiOf(it.store) + ' ' + it.store + '（#' + it.no + '）'));
    r0.appendChild(b0); chat.appendChild(r0);
    // やり取り
    var hasStatusEvent = false;
    (it.msgs || []).forEach(function(m) {
      if (m.from === 'status') {
        hasStatusEvent = true;
        chat.appendChild(el('div', 'pill', (m.text.indexOf('向かいます') >= 0 ? '✅ ' : '⚠️ ') + m.text));
      } else if (m.from === 'ipad') {
        var r = el('div', 'row me'); r.appendChild(el('div', 'bub', m.text)); chat.appendChild(r);
      } else {
        var r2 = el('div', 'row other'); r2.appendChild(el('div', 'icon', '👤'));
        var c = el('div', 'col'); c.appendChild(el('div', 'who', m.who)); c.appendChild(el('div', 'bub', m.text));
        r2.appendChild(c); chat.appendChild(r2);
      }
    });
    // いまの状態（「向かいます」はやり取りの流れの中に出すので、記録がない古いものだけ最後に出す）
    var st = '';
    if (it.status === '対応済み') { if (!hasStatusEvent) st = '✅ ' + (it.responder || '社員') + 'さんが向かいます'; }
    else if (it.status === '未対応') st = '⏳ 社員の対応を待っています';
    else st = '受付終了（' + (it.status || '終了') + '）';
    if (st) chat.appendChild(el('div', 'pill', st));
    if (it.open) { var o = el('option', null, '#' + it.no + ' ' + it.store + ' へ'); o.value = it.no; sel.appendChild(o); }
  });
  if (keep && Array.prototype.some.call(sel.options, function(o){ return o.value === keep; })) sel.value = keep;
  else if (sel.options.length) sel.value = sel.options[sel.options.length - 1].value;
  document.getElementById('inputbar').style.display = sel.options.length ? 'flex' : 'none';
  document.getElementById('qrTile').disabled = !(!D.share && sel.options.length);
  sel.style.display = sel.options.length > 1 ? '' : 'none';
  // 受付が終わったものは一覧から外す（画面には今回までは残す）
  if (!D.share) {
    active = active.filter(function(a){ return live.some(function(it){ return it.no === a.no && it.open; }) || Date.now() - a.at < 10 * 60 * 1000; });
    save();
  }
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('qrTile').onclick = function(){
  var nos = Array.prototype.map.call(document.getElementById('target').options, function(o){ return o.value; });
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.ok) { toast((r && r.error) || 'QRコードを作れませんでした'); return; }
    var box = document.getElementById('qrBox'); box.textContent = '';
    if (typeof qrcode === 'function') {
      var q = qrcode(0, 'M'); q.addData(r.url); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2 });
    } else {
      box.textContent = 'QRコードを表示できませんでした（ネット接続を確認してください）';
    }

    document.getElementById('qrModal').classList.add('on');
  }).withFailureHandler(function(){ toast('通信できませんでした'); }).ipadShareLink(D.token, nos);
};

refresh();
// 呼び出し中があるときだけ 10秒ごとに更新（何もないときは通信しない）
setInterval(function(){ if (active.length && !document.hidden) refresh(); }, 10000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
</script>
